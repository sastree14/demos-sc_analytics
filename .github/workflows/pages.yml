name: Publish SC-Analytics demonstrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sc-analytics-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Exercise all 32 cases in Chrome
        run: |
          python -m venv "$RUNNER_TEMP/lab-qa"
          source "$RUNNER_TEMP/lab-qa/bin/activate"
          pip install playwright==1.56.0 pypdf==6.1.3
          python tests/browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solutions-lab-visual-qa
          path: qa-evidence/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate real analytical models
        run: npm test
      - name: Assemble static demonstration site
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R predictive-models optimization automation-ai modelling-scenarios simulations bi-reporting custom-apps shared dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

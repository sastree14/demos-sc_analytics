name: Publish SC-Analytics demonstrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sc-analytics-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Validate Industry Lab prototype syntax
        run: |
          node --check industry-lab/app.js
          test -f industry-lab/index.html
          test -f industry-lab/app.css
          grep -q 'SC18' industry-lab/app.js
      - name: Verify 18 sectors and 108 quantitative scenarios
        run: |
          node --check industry-lab/experience.js
          node --check industry-lab/models.js
          node --check industry-lab/catalog.js
          node --check industry-lab/i18n.js
          node industry-lab/tests.mjs
          node industry-lab/manufacturing.test.mjs
          node industry-lab/food.test.mjs
          node industry-lab/pharma.test.mjs
          node industry-lab/restaurant.test.mjs
          node industry-lab/hotel.test.mjs
          node industry-lab/retail.test.mjs
          node industry-lab/clinic.test.mjs
          node industry-lab/construction.test.mjs
          node industry-lab/real-estate.test.mjs
          node industry-lab/finance-insurance.test.mjs
          node industry-lab/problem-copy.test.mjs
          node industry-lab/final-sectors.test.mjs
          node industry-lab/expanded.test.mjs
      - name: Exercise all 32 cases in Chrome
        run: |
          python -m venv "$RUNNER_TEMP/lab-qa"
          source "$RUNNER_TEMP/lab-qa/bin/activate"
          pip install playwright==1.56.0 pypdf==6.1.3
          python tests/browser_qa.py
          python industry-lab/browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solutions-lab-visual-qa
          path: qa-evidence/
          retention-days: 7
      - name: Assemble the verified site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R predictive-models optimization automation-ai modelling-scenarios simulations bi-reporting custom-apps shared industry-lab dist/
      - name: Upload Pages release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact: pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified package
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.validate.outputs.artifact }}
